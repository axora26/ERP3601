packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks unreviewed dependency lifecycle scripts by default.
# Keep this list exact and intentionally narrow; do not replace it with
# dangerouslyAllowAllBuilds.
allowBuilds:
  "@prisma/engines@7.10.0": true
  "esbuild@0.28.2": true
  "prisma@7.10.0": true
